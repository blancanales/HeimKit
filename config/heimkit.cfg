# HeimKit configuration
# Optional reference: the plugin creates its server config automatically on first use.
# Stop the server before editing; save and restart to apply changes.

[Torches]
# true enables free automatic torch refilling; false disables it.
Enabled = true

# Seconds between refill passes (2 to 60).
IntervalSeconds = 5

# Maximum refill requests sent per pass (1 to 256).
MaxMessagesPerPass = 32

# Candidate prefabs; the plugin also checks eligibility at runtime.
Prefabs = piece_groundtorch_wood,piece_groundtorch,piece_groundtorch_green,piece_groundtorch_blue,piece_walltorch

[Diagnostics]
# One switch for all troubleshooting output. Stop the server before editing and restart afterward.
# false: startup, configuration, state, readiness, warnings and errors.
# true: also refill counts, status explanations and sampled per-torch details.
# Status and detailed samples are automatically rate limited to 60 seconds.
DebugMode = false
