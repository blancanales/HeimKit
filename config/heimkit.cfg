# HeimKit configuration
# Optional reference: the plugin creates its server config automatically on first use.
# HeimMender settings reload during play. Other sections require a server restart.

[PlayerActivity]
DebugMode = false
# Shared idle detection used by AFK sleep exclusion and raid protection.
# Some local menu, inventory and camera actions are invisible to the server.

# How long a player must go without activity the server can detect before HeimKit considers them
# idle. Default: 300 seconds (5 minutes). Lower values mark players idle sooner; higher values
# wait longer. The join/recovery grace must also have ended. Restart after edits.
# Allowed: 30 to 3600 seconds.
IdleTimeoutSeconds = 300

# Minimum time a player is kept active after joining or recovering from loading, death or
# unreliable player information. Default: 60 seconds (1 minute). Both this grace period and the
# idle timeout must have passed before the player can be considered idle; the two times are not
# added together. Restart after edits.
# Allowed: 0 to 600 seconds.
JoinGraceSeconds = 60

# How far a player position must change from the last activity position to count as movement.
# Default: 0.5 meters. Small position changes can build up to this threshold. Lower values
# detect smaller movements; higher values ignore more small movements. Being carried or moved by
# the world also counts. Restart after edits.
# Allowed: 0.1 to 5 meters.
MovementThresholdMeters = 0.5

# How much a player character must turn for the server to count it as activity. Default: 10
# degrees. Lower values detect smaller turns; higher values require larger turns. This checks
# character direction reported to the server, so moving only the camera may not count. Restart
# after edits.
# Allowed: 1 to 90 degrees.
LookThresholdDegrees = 10

# How often HeimKit checks player state for activity, in seconds. Default: 1 second. Lower
# values check more often and use more server processing; higher values check less often and may
# delay detecting changes. Checks run whenever an enabled feature needs idle detection,
# including during the day. Restart after edits.
# Allowed: 0.2 to 5 seconds.
SampleIntervalSeconds = 1

[Diagnostics]
# Enable diagnostics across features unless a hidden feature override suppresses them.
# With this off, each feature's DebugMode can enable only that feature's diagnostics.
# Startup, readiness, warnings and errors remain visible. All samples remain bounded.
DebugMode = false

[Torches]
DebugMode = false
# true enables free automatic refilling of eligible lights and fires; false disables it.
Enabled = true

# Seconds between refill passes (2 to 60).
IntervalSeconds = 5

# Maximum refill requests sent per pass (1 to 256).
MaxMessagesPerPass = 32

# Master switch for campfire, hearth and bonfire refilling. Disabled by default.
# False excludes all three even if manually listed in Prefabs.
IncludeFireplaces = false

# Individual fire types; these apply only when IncludeFireplaces is true.
# False excludes that type even if manually listed in Prefabs.
Campfires = true
Hearths = true
Bonfires = true

# Candidate prefabs; the plugin also checks eligibility at runtime.
Prefabs = piece_groundtorch_wood,piece_groundtorch,piece_groundtorch_green,piece_groundtorch_blue,piece_walltorch,piece_brazierceiling01,piece_brazierfloor01,piece_brazierfloor02

[WeatherGuard]
DebugMode = false
# Independent feature enable switch. Existing users retain this setting on upgrade.
Enabled = true

# Independently suppress rain and underwater wetness wear. Both defaults preserve existing behavior.
ProtectRain = true
ProtectUnderwater = true

# Exact case-sensitive prefab identifiers separated by commas; empty leaves the normal scope unchanged.
ExcludedPrefabs =

# Medium: grouped prevention steps. Detailed: native conditions, anomalies and diagnostic counters.
DebugLogLevel = Detailed

# Include otherwise qualifying world-created items in debug logs; does not enable protection.
LogWorldCreatedItems = false

# Protect player-built structural pieces automatically using server processing.
# Existing creators are preserved. Repaired world-piece claiming is inactive.
# No logout or client mod is required by this implementation.

[AFKNightWatch]
DebugMode = false
Enabled = true
MajoritySleepEnabled = true
ExcludeAFKFromSleep = true
RequiredSleepingPercent = 50
RequireMoreThanPercent = true
SleepDelaySeconds = 30

[AFKRaidWatch]
Enabled = true
DebugMode = false

[SharedMap]
# Persistent community exploration, optional portal/resource/dungeon markers and native table map filtering.
Enabled = true
PinDebugNameFilter =
PortalMarkerSync = true
PortalClusterDistanceMeters = 60
# Outdoor mineable metal/Obsidian dots; excludes scraps, interiors and creature sources.
ResourceMarkerSync = true
# Also discover remaining deposits in old community-explored terrain without revisiting.
ResourceDiscoverPreviouslyExplored = false
ResourceClusterDistanceMeters = 30
# Hide resource publications near other generated landmark markers; zero disables hiding.
ResourceMarkerHideDistanceMeters = 10
SilverDiscoveryRadiusMeters = 10
ResourceRemoveDepleted = true
# Supported exterior dungeon entrances use labeled hammer markers; publications within ten metres share one anchor.
DungeonMarkerSync = true
# Show percentages after observed entry or verified picked items; supported visited empty dungeons show 0%.
DungeonLootProgress = true
# Also discover placed entrances in old community-explored terrain without revisiting.
DungeonDiscoverPreviouslyExplored = false
# False rejects player map uploads before importing terrain; Read Map and server updates continue.
AllowPlayerMapWrites = true
# Share player X checkmarks independently of automatic dungeon pickup percentages.
SharePinCheckmarks = false
# Placed lore-stone and visible, player-destructible recurring-spawner dots; independent switches, both enabled by default.
RunestoneMarkerSync = true
SpawnerMarkerSync = true
DebugMode = false
TableIntervalSeconds = 10
MaxTablesPerPass = 1
SaveIntervalSeconds = 60

